<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>采集岗位</title><style>body{font:14px system-ui;width:340px;padding:14px;color:#222}h3{margin:0 0 10px}button{padding:8px 12px;border:0;border-radius:6px;background:#1677ff;color:white;cursor:pointer}label{display:block;margin:8px 0 3px;color:#666}input,textarea{box-sizing:border-box;width:100%;padding:7px;border:1px solid #ccc;border-radius:5px}textarea{height:84px}.muted{color:#777;font-size:12px}#status{margin-top:10px}</style><body><h3>采集当前 BOSS 岗位</h3><div id="form"><label>岗位名称</label><input id="title"><label>公司名称</label><input id="company"><label>工作地点</label><input id="location"><label>薪资范围</label><input id="salary"><label>原始招聘链接</label><input id="url" type="url"><label>岗位描述</label><textarea id="detail"></textarea><p class="muted">请核对信息和链接。岗位信息会写入 Notion（已配置时），并保存在本地。</p><button id="save">保存岗位</button></div><div style="margin-top:12px"><button id="openJobs" style="background:#666">已采集岗位</button></div><div id="status"></div><script src="popup.js"></script></body></html>
